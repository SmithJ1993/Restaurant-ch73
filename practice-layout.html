<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox and practing layouts</title>
    <style>
        .flex-sample {
            display: flex;
            flex-direction: column-reverse;
            justify-content: start;
            align-items: end;
            height: 400px;
            background-color: #dedede;
        }

        .box {
            background-color: orange;
            padding: 30px;
            color: white;
            margin: 3px;
        }
    </style>
</head>
<body>
    <!-- flex practice-->
     <section class="flex-sample">
        <div class="box">A</div>
        <div class="box">B</div>
        <div class="box">C</div>
     </section>
</body>
</html>
